name: Build RayTraceAntiXray 26.1.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find 26.1.2 commit
        id: find-commit
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for RayTraceAntiXray 26.1.2 commit..."

          COMMIT="$(git log --all \
            --format='%H' \
            --grep='26\.1\.2' \
            -n 1)"

          if [ -z "$COMMIT" ]; then
            echo "::error::Could not find a commit mentioning 26.1.2."
            echo
            echo "Available matching commits:"
            git log --all --oneline --decorate --grep='26\.1' || true
            exit 1
          fi

          echo "Found commit:"
          git show -s --format='%H %s' "$COMMIT"

          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout 26.1.2 source
        run: |
          set -euo pipefail

          git checkout "${{ steps.find-commit.outputs.commit }}"

          echo "Selected commit:"
          git show -s --format='%H%n%s%n%ad' --date=iso

      - name: Verify Minecraft/Paper version
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_MINECRAFT="26.1.2"

          echo "Checking Maven configuration..."

          MINECRAFT_VERSION="$(sed -n 's:.*<minecraftVersion>\(.*\)</minecraftVersion>.*:\1:p' pom.xml | head -n 1)"
          PAPER_VERSION="$(sed -n 's:.*<paperVersion>\(.*\)</paperVersion>.*:\1:p' pom.xml | head -n 1)"

          echo "minecraftVersion = ${MINECRAFT_VERSION:-NOT FOUND}"
          echo "paperVersion     = ${PAPER_VERSION:-NOT FOUND}"

          if [ "$MINECRAFT_VERSION" != "$EXPECTED_MINECRAFT" ]; then
            echo "::error::Wrong Minecraft version!"
            echo "Expected: $EXPECTED_MINECRAFT"
            echo "Found:    ${MINECRAFT_VERSION:-NOT FOUND}"
            exit 1
          fi

          if [[ "$PAPER_VERSION" != 26.1.2.* ]]; then
            echo "::error::Wrong Paper version!"
            echo "Expected Paper 26.1.2.x"
            echo "Found:    ${PAPER_VERSION:-NOT FOUND}"
            exit 1
          fi

          echo "Maven version verification passed."

      - name: Verify plugin.yml API version
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_API="26.1.2"

          PLUGIN_YML="RayTraceAntiXray/src/main/resources/plugin.yml"

          if [ ! -f "$PLUGIN_YML" ]; then
            echo "::error::plugin.yml not found: $PLUGIN_YML"
            exit 1
          fi

          API_VERSION="$(sed -n "s/^api-version:[[:space:]]*['\"]\\{0,1\\}\\([^'\"]*\\)['\"]\\{0,1\\}/\\1/p" "$PLUGIN_YML" | head -n 1)"

          echo "plugin.yml api-version = ${API_VERSION:-NOT FOUND}"

          if [ "$API_VERSION" != "$EXPECTED_API" ]; then
            echo "::error::Wrong plugin API version!"
            echo "Expected: $EXPECTED_API"
            echo "Found:    ${API_VERSION:-NOT FOUND}"
            exit 1
          fi

          echo "plugin.yml API verification passed."

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: |
          chmod +x mvnw
          ./mvnw clean package --batch-mode

      - name: Verify generated JAR
        shell: bash
        run: |
          set -euo pipefail

          JAR="$(find RayTraceAntiXray/target -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            | head -n 1)"

          if [ -z "$JAR" ]; then
            echo "::error::No plugin JAR was generated."
            exit 1
          fi

          echo "Generated JAR:"
          echo "$JAR"

          echo
          echo "JAR contents:"
          unzip -l "$JAR" | grep 'plugin.yml'

          echo
          echo "Generated plugin.yml:"
          unzip -p "$JAR" plugin.yml

          GENERATED_API="$(unzip -p "$JAR" plugin.yml \
            | sed -n "s/^api-version:[[:space:]]*['\"]\\{0,1\\}\\([^'\"]*\\)['\"]\\{0,1\\}/\\1/p" \
            | head -n 1)"

          if [ "$GENERATED_API" != "26.1.2" ]; then
            echo "::error::Generated JAR has wrong API version!"
            echo "Expected: 26.1.2"
            echo "Found:    ${GENERATED_API:-NOT FOUND}"
            exit 1
          fi

          echo
          echo "Generated JAR verification passed."

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v6
        with:
          name: RayTraceAntiXray-1.17.1-26.1.2
          path: |
            RayTraceAntiXray/target/*.jar
            !RayTraceAntiXray/target/*-sources.jar
            !RayTraceAntiXray/target/*-javadoc.jar
