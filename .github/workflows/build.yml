name: Build RayTraceAntiXray

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Make scripts executable
        run: chmod +x mvnw compile.sh compilew.sh 2>/dev/null || true

      - name: Run build
        env:
          MAVEN_OPTS: "-Xmx3G"
        run: |
          if [ -f "./compilew.sh" ]; then
            ./compilew.sh
          elif [ -f "./compile.sh" ]; then
            ./compile.sh
          else
            ./mvnw clean package -DskipTests
          fi

      - name: Upload Built JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RayTraceAntiXray-jar
          path: |
            RayTraceAntiXray/target/*.jar
            target/*.jar
          if-no-files-found: error
